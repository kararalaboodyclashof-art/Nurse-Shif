      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12" />
  
  <!-- Hospital Cross -->
  <path d="M224 150 h64 v64 h64 v64 h-64 v64 h-64 v-64 h-64 v-64 h64 z" fill="url(#accent)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))" />
  
